<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 530" width="500" height="530" role="img" aria-labelledby="title desc">
  <title id="title">How OVERDRIVE fits together</title>
  <desc id="desc">The coordinator conversation sends specs to feature lanes, each a full clone with its own agent. QA agents keep suites in a separate lab and exchange findings and fixes with the lanes. A local runtime holds state, delivers messages, executes lab runs and does the Git work. A lane goes to delivery directly or through an optional integration build that merges several, and delivery requires a passing run at the exact commit: a managed project fast-forwards, an adopted repository gets push and fetch commands.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 16px; font-weight: 600; }
    .sub { font-size: 13px; fill: #59636e; }
    .label { font-size: 13px; fill: #59636e; }
    .box { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.5; }
    .accent { fill: #f5f0ff; stroke: #7c3aed; stroke-width: 1.5; }
    .line { fill: none; stroke: #818b98; stroke-width: 1.5; }
    .head { fill: #818b98; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .sub, .label { fill: #9198a1; }
      .box { fill: #151b23; stroke: #3d444d; }
      .accent { fill: #221a38; stroke: #a78bfa; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>

  <rect class="accent" x="30" y="10" width="200" height="80" rx="8"/>
  <text class="title" x="46" y="37">Coordinator</text>
  <text class="sub" x="46" y="58">your Codex or Claude</text>
  <text class="sub" x="46" y="76">Code session</text>

  <rect class="box" x="310" y="10" width="180" height="80" rx="8"/>
  <text class="title" x="326" y="37">Runtime</text>
  <text class="sub" x="326" y="58">local state, messages,</text>
  <text class="sub" x="326" y="76">lab runs, Git work</text>

  <rect class="box" x="38" y="158" width="200" height="80" rx="8"/>
  <rect class="box" x="34" y="154" width="200" height="80" rx="8"/>
  <rect class="box" x="30" y="150" width="200" height="80" rx="8"/>
  <text class="title" x="46" y="177">Feature lanes</text>
  <text class="sub" x="46" y="198">a full clone and</text>
  <text class="sub" x="46" y="216">agent each</text>

  <rect class="box" x="310" y="150" width="180" height="80" rx="8"/>
  <text class="title" x="326" y="177">QA agents</text>
  <text class="sub" x="326" y="198">suites in lab/, run</text>
  <text class="sub" x="326" y="216">at exact commits</text>

  <rect class="box" x="30" y="290" width="200" height="80" rx="8"/>
  <text class="title" x="46" y="317">Integration build</text>
  <text class="sub" x="46" y="338">optional: several</text>
  <text class="sub" x="46" y="356">lanes merged</text>

  <rect class="box" x="30" y="440" width="200" height="80" rx="8"/>
  <text class="title" x="46" y="467">Delivery</text>
  <text class="sub" x="46" y="488">managed: fast-forward</text>
  <text class="sub" x="46" y="506">adopted: push and fetch</text>

  <path class="line" d="M130 92V148" marker-end="url(#arrow)"/>
  <text class="label" x="140" y="124">specs</text>

  <path class="line" d="M232 50H308" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="254" y="42">tools</text>

  <path class="line" d="M400 92V148" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="410" y="124">runs</text>

  <path class="line" d="M240 205H308" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="246" y="180">findings,</text>
  <text class="label" x="246" y="196">fixes</text>

  <path class="line" d="M130 240V288" marker-end="url(#arrow)"/>

  <path class="line" d="M28 190H14V395H130"/>
  <path class="line" d="M130 372V438" marker-end="url(#arrow)"/>
  <text class="label" x="140" y="414">passing run,</text>
  <text class="label" x="140" y="430">no blockers</text>
</svg>
